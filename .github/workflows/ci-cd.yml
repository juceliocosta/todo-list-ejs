name: Pipeline de CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar o Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        
      - name: Instalar as dependencias
        run: npm ci

      - name: Executar os testes
        run: npm test

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest


    steps:
      - name: Deploy para Produção
        run: |
          echo "Deployando para produção..."